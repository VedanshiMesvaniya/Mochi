[pytest]
testpaths = tests
python_files = test_*.py
; Root-cause fix for a real-world Windows failure mode: pytest's default
; tmp_path base lives under the OS temp dir (%TEMP%\pytest-of-<user> on
; Windows), a directory pytest itself does not fully control the ACLs
; of - if it's ever created/touched by a different process/user context
; (a previous run under another account, an antivirus scan, OneDrive,
; etc.), every later run fails at collection with
; "PermissionError: [WinError 5] Access is denied" trying to scandir()
; it, before a single test even runs. Pointing --basetemp at a plain
; folder inside the repo sidesteps that entirely: pytest creates and
; fully owns this directory, so it's never subject to another process'
; leftover permissions. Kept out of git (.pytest_tmp/ in .gitignore).
addopts = --basetemp=.pytest_tmp
