name: CI

# Runs on every push and PR against main and any feat/* branch (see
# CONTRIBUTING note in README: work happens on feat/... branches, never
# directly on main) - so a PR into main always has a green/red check
# before it gets merged, and pushes to a feature branch get the same
# signal without waiting for a PR to exist.
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }}, calendar-extras=${{ matrix.calendar-extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        calendar-extras: [false]
        # One leg of the matrix also installs the optional Google
        # Calendar client libraries (requirements-calendar.txt), so CI
        # actually exercises both of app/calendar/google_calendar.py's
        # supported states: "libraries absent" (every other leg - the
        # normal, fully-local install) and "libraries present". Both
        # must pass the exact same test suite (see
        # tests/test_google_calendar.py's own note on why it never
        # requires these libraries to run at all).
        include:
          - python-version: "3.12"
            calendar-extras: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-calendar.txt

      # PySide6 (Qt) needs these shared libraries present on the runner
      # even for the headless "offscreen" platform used in tests (see
      # tests/conftest.py, which sets QT_QPA_PLATFORM=offscreen before
      # anything imports PySide6) - GitHub's ubuntu-latest runner doesn't
      # ship them by default. No virtual display (Xvfb) is needed since
      # nothing here ever renders to a real screen; this was confirmed
      # working end-to-end (all 383 tests) once the actual cause of an
      # earlier round of CI failures - two tests that assumed the network
      # would be unreachable rather than mocking it, see
      # tests/test_trend_fetcher.py / tests/test_meme_fetcher.py - was
      # fixed.
      - name: Install system Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install optional Google Calendar dependencies
        if: matrix.calendar-extras
        run: pip install -r requirements-calendar.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
