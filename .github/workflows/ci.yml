name: CI

# Runs on every push and PR against main and any feat/* branch (see
# CONTRIBUTING note in README: work happens on feat/... branches, never
# directly on main) - so a PR into main always has a green/red check
# before it gets merged, and pushes to a feature branch get the same
# signal without waiting for a PR to exist.
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

# checks: write is needed by the test-reporter step below, which
# publishes JUnit results as annotations on the run (see that step's own
# comment for why this exists).
permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }}, calendar-extras=${{ matrix.calendar-extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        calendar-extras: [false]
        # One leg of the matrix also installs the optional Google
        # Calendar client libraries (requirements-calendar.txt), so CI
        # actually exercises both of app/calendar/google_calendar.py's
        # supported states: "libraries absent" (every other leg - the
        # normal, fully-local install) and "libraries present". Both
        # must pass the exact same test suite (see
        # tests/test_google_calendar.py's own note on why it never
        # requires these libraries to run at all).
        include:
          - python-version: "3.12"
            calendar-extras: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-calendar.txt

      # PySide6 (Qt) needs a handful of system shared libraries present
      # even when running headless, and hosted GitHub runners don't ship
      # all of them. Rather than rely on Qt's "offscreen" QPA platform
      # (which has a smaller but less predictable/less-documented set of
      # library requirements that can differ by Qt minor version) this
      # runs under a real virtual X server (Xvfb) with the ordinary "xcb"
      # platform instead - the combination most Qt/PySide/PyQt projects
      # use for CI specifically because it's the most consistently
      # well-supported path, at the cost of a slightly heavier dependency
      # list. tests/conftest.py's own QT_QPA_PLATFORM=offscreen default
      # (via os.environ.setdefault) is unaffected and still applies for
      # anyone running tests locally without Xvfb - the QT_QPA_PLATFORM=xcb
      # set on the "Run tests" step below takes precedence over that
      # default only in this CI job.
      - name: Install system Qt + Xvfb runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install optional Google Calendar dependencies
        if: matrix.calendar-extras
        run: pip install -r requirements-calendar.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: xcb
        run: >-
          xvfb-run -a pytest -v
          --junitxml=junit-${{ matrix.python-version }}-${{ matrix.calendar-extras }}.xml

      # Publishes the JUnit results as a Check Run with per-test
      # annotations, visible directly on the PR/commit in GitHub's UI -
      # unlike the raw step log (served from Azure Blob Storage), this
      # goes through GitHub's own Checks API, so failure details are
      # actually inspectable via `gh` / the API without following an
      # external redirect. Runs even when the tests above failed
      # (`if: always()`) since that's exactly when it's needed most.
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Results (py${{ matrix.python-version }}, calendar-extras=${{ matrix.calendar-extras }})
          path: "junit-*.xml"
          reporter: java-junit
          fail-on-error: "false"
